<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MotionTalk workflow</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1600px;
        height: 420px;
        margin: 0;
        overflow: hidden;
      }

      body {
        color: #13243b;
        background:
          radial-gradient(circle at 12% 4%, rgba(64, 132, 255, 0.16), transparent 33%),
          radial-gradient(circle at 93% 94%, rgba(99, 225, 200, 0.13), transparent 28%),
          #f4f7fb;
        font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      main {
        width: 100%;
        height: 100%;
        padding: 45px 52px 48px;
      }

      .eyebrow {
        margin: 0 0 20px 4px;
        color: #6a7b91;
        font-size: 17px;
        font-weight: 750;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .flow {
        display: grid;
        grid-template-columns: 1.5fr 58px 1fr 58px 1fr 58px 0.82fr;
        align-items: stretch;
        height: 282px;
      }

      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-width: 0;
        padding: 31px 32px 30px;
        overflow: hidden;
        border: 1px solid rgba(54, 82, 121, 0.12);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.93);
        box-shadow: 0 18px 44px rgba(42, 64, 96, 0.09);
      }

      .card:first-child {
        color: #fff;
        border-color: transparent;
        background: linear-gradient(135deg, #2468ea 0%, #3585f2 58%, #43a6ed 100%);
        box-shadow: 0 20px 48px rgba(36, 104, 234, 0.23);
      }

      .card.optional {
        border: 2px dashed rgba(52, 112, 215, 0.34);
        background: rgba(245, 250, 255, 0.86);
        box-shadow: none;
      }

      .step {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #6e8097;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      .card:first-child .step {
        color: rgba(255, 255, 255, 0.76);
      }

      .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #3d82ed;
        box-shadow: 0 0 0 7px rgba(61, 130, 237, 0.11);
      }

      .card:first-child .dot {
        background: #fff;
        box-shadow: 0 0 0 7px rgba(255, 255, 255, 0.15);
      }

      .optional .dot {
        background: transparent;
        border: 2px solid #5791eb;
        box-shadow: none;
      }

      .label {
        max-width: 100%;
        font-size: 35px;
        font-weight: 850;
        line-height: 1.24;
        letter-spacing: -0.035em;
      }

      .card:first-child .label {
        font-size: 38px;
      }

      .arrow {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8ba0ba;
        font-size: 43px;
        font-weight: 500;
      }

      html[lang="en"] .label {
        font-size: 30px;
        letter-spacing: -0.04em;
      }

      html[lang="en"] .card:first-child .label {
        font-size: 32px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow" id="eyebrow"></p>
      <section class="flow" aria-label="MotionTalk workflow">
        <article class="card">
          <div class="step"><span>01</span><span class="dot"></span></div>
          <div class="label" id="step-1"></div>
        </article>
        <div class="arrow">→</div>
        <article class="card">
          <div class="step"><span>02</span><span class="dot"></span></div>
          <div class="label" id="step-2"></div>
        </article>
        <div class="arrow">→</div>
        <article class="card">
          <div class="step"><span>03</span><span class="dot"></span></div>
          <div class="label" id="step-3"></div>
        </article>
        <div class="arrow">→</div>
        <article class="card optional">
          <div class="step"><span>04</span><span class="dot"></span></div>
          <div class="label" id="step-4"></div>
        </article>
      </section>
    </main>
    <script>
      const copy = {
        zh: {
          lang: "zh-CN",
          eyebrow: "MotionTalk · 和 AI 说几句话就行",
          steps: [
            "给 AI 视频和字幕，<br>说几句想要的效果",
            "AI 给出<br>导演方案",
            "收到<br>最终成片",
            "调整<br>（可选）",
          ],
        },
        en: {
          lang: "en",
          eyebrow: "MotionTalk · Just tell the Agent what you want",
          steps: [
            "Give the Agent your video + subtitles,<br>then describe the result",
            "The Agent proposes<br>a director plan",
            "Receive the<br>final video",
            "Optional<br>adjustments",
          ],
        },
      };

      const selected = new URLSearchParams(location.search).get("lang") === "en" ? copy.en : copy.zh;
      document.documentElement.lang = selected.lang;
      document.getElementById("eyebrow").textContent = selected.eyebrow;
      selected.steps.forEach((text, index) => {
        document.getElementById(`step-${index + 1}`).innerHTML = text;
      });
    </script>
  </body>
</html>
